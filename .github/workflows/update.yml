name: Mise a jour automatique

on:
  schedule:
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser pandas pyarrow requests beautifulsoup4 lxml groq python-dotenv playwright
          playwright install chromium

      - name: Create .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
          echo "EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}" >> .env

      - name: Fetch news
        run: python -m src.ingest.banks_news

      - name: Analyze sentiment (mots-cles)
        run: python -m src.nlp.sentiment_fr --keywords-only
        continue-on-error: true

      - name: Enhance with Llama (60 news max)
        run: python -m src.nlp.sentiment_auto
        continue-on-error: true

      - name: Fetch history (1x par jour a 14h)
        run: |
          if [ $(date +%H) -eq 14 ]; then
            python -m src.ingest.bvmt_history
            python -m src.analysis.bank_index
          else
            echo "Skip - uniquement a 14h"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')"
          git push